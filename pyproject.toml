[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feln-laya"
version = "0.1.0"
description = "Catalog-grounded typed decisions to FELN, on CUDA and native MLX"
requires-python = ">=3.12"
dependencies = ["feln-type"]

[project.optional-dependencies]
mlx = ["mlx>=0.31"]
dev = ["pytest", "ruff"]

[project.scripts]
feln-laya = "feln_laya.cli:main"

[tool.uv.sources]
feln-type = { path = "../feln-type", editable = true }
feln = { path = "../feln", editable = true }
layers-json = { path = "../layers-json", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
